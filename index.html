<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Groceries</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Groceries">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f2f2f7; --hdr:rgba(242,242,247,.86); --card:#fff; --text:#000; --sec:#8e8e93;
  --sep:rgba(60,60,67,.2); --circle:#c7c7cc; --accent:#34c759; --tint:#007aff; --red:#ff3b30;
  --bar:rgba(249,249,249,.86); --fill:rgba(118,118,128,.12); --chip:#fff; --overlay:rgba(0,0,0,.32);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000; --hdr:rgba(0,0,0,.82); --card:#1c1c1e; --text:#fff; --sec:#8e8e93;
  --sep:rgba(84,84,88,.6); --circle:#545458; --accent:#30d158; --tint:#0a84ff; --red:#ff453a;
  --bar:rgba(22,22,24,.86); --fill:rgba(118,118,128,.24); --chip:#2c2c2e; --overlay:rgba(0,0,0,.55);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%}
body{min-height:100vh;cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer}

/* header */
#top{position:sticky;top:0;z-index:5;background:var(--hdr);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  padding:calc(env(safe-area-inset-top) + 8px) 16px 10px}
.titlerow{display:flex;align-items:flex-end;justify-content:space-between;max-width:640px;margin:0 auto}
h1{margin:4px 0 4px;font-size:34px;font-weight:700;letter-spacing:.2px}
.textbtn{background:none;border:0;color:var(--tint);font-size:17px;padding:6px 0 14px}
.textbtn[hidden]{display:none}
.hbtns{display:flex;gap:18px;align-items:center}
#orderBtn{display:flex}

/* list */
main{max-width:640px;margin:0 auto;padding:0 16px}
.sec h2{display:flex;justify-content:space-between;margin:20px 16px 7px;font-size:13px;font-weight:400;
  text-transform:uppercase;letter-spacing:.3px;color:var(--sec)}
.card{list-style:none;margin:0;padding:0;background:var(--card);border-radius:12px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:13px;min-height:50px;padding:12px 16px;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:background .15s}
.row::after{content:"";position:absolute;left:52px;right:0;bottom:0;height:.5px;background:var(--sep)}
.row:last-child::after{display:none}
.row.pressed{background:var(--fill)}
.check{flex:none;width:23px;height:23px;border-radius:50%;border:1.5px solid var(--circle);position:relative;
  transition:background .15s,border-color .15s}
.done .check{background:var(--accent);border-color:var(--accent)}
.done .check::after{content:"";position:absolute;left:6.5px;top:3px;width:5px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.name{flex:1;word-break:break-word}
.done .name{color:var(--sec);text-decoration:line-through}
.row.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%{background:rgba(52,199,89,.28)}100%{background:transparent}}
.empty{text-align:center;color:var(--sec);margin-top:18vh;padding:0 30px;line-height:1.45}
.empty b{display:block;color:var(--text);font-size:20px;margin-bottom:6px}

/* composer (tap anywhere to add) */
#compWrap{max-width:640px;margin:0 auto;padding:22px 16px calc(45vh + env(safe-area-inset-bottom))}
.comp .crow{display:flex;align-items:center;gap:13px;min-height:50px;padding:4px 16px;margin:0}
.addc{flex:none;width:23px;height:23px;border-radius:50%;background:var(--tint);color:#fff;
  display:grid;place-items:center}
#input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:17px;padding:10px 0;outline:none;cursor:text}
#input::placeholder{color:var(--sec)}
.sugg{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px 52px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg:empty{display:none}
.sugg button{flex:none;border:0;background:var(--fill);border-radius:999px;padding:7px 13px;font-size:15px;white-space:nowrap;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.sugg button::before{content:"+ ";color:var(--tint);font-weight:600}

/* sheet */
#overlay{position:fixed;inset:0;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#overlay.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:640px;margin:0 auto;background:var(--bg);
  border-radius:14px 14px 0 0;max-height:86vh;display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  padding-bottom:env(safe-area-inset-bottom)}
#sheet.open{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--circle);margin:7px auto 0;opacity:.7}
.shead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 16px 10px}
.shead .stitle{font-weight:600;text-align:center;max-width:62vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shead .sub{grid-column:1/-1;text-align:center;font-size:13px;color:var(--sec);margin-top:2px}
.shead .l{justify-self:start}.shead .r{justify-self:end;font-weight:600}
.sbody{overflow-y:auto;padding:0 16px 18px;-webkit-overflow-scrolling:touch}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:46px;padding:11px 16px;
  background:none;border:0;text-align:left;position:relative}
.opt::after{content:"";position:absolute;left:16px;right:0;bottom:0;height:.5px;background:var(--sep)}
.card > :last-child::after{display:none}
.opt .tick{color:var(--tint);font-weight:600}
.danger{display:block;width:100%;margin-top:18px;background:var(--card);border:0;border-radius:12px;
  color:var(--red);padding:13px;font-size:17px}
.slabel{margin:16px 16px 7px;font-size:13px;color:var(--sec);text-transform:uppercase;letter-spacing:.3px}
.drow{display:flex;align-items:center;min-height:46px;padding:0 0 0 16px;position:relative;background:var(--card)}
.drow::after{content:"";position:absolute;left:16px;right:0;bottom:0;height:.5px;background:var(--sep)}
.drow:last-child::after{display:none}
.drow span{flex:1}
.drow.dragging{z-index:2;box-shadow:0 6px 20px rgba(0,0,0,.18);border-radius:10px;transition:none}
.handle{width:54px;height:46px;display:grid;place-items:center;color:var(--sec);touch-action:none;cursor:grab}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);z-index:15;
  transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:all .2s;
  background:rgba(40,40,42,.94);color:#fff;border-radius:12px;padding:10px 14px;
  display:flex;gap:16px;align-items:center;font-size:15px;white-space:nowrap;max-width:92vw}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:#0a84ff;font-weight:600;font-size:15px;padding:0}
#toast button[hidden]{display:none}
.hap{position:absolute;opacity:0;pointer-events:none;width:0;height:0;overflow:hidden}
</style>
</head>

             autocomplete="off" autocorrect="on" autocapitalize="sentences" spellcheck="true">

  </form>
</div>

<div id="toast"><span id="toastMsg"></span><button id="toastBtn">Undo</button></div>
<div id="overlay"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<label class="hap" id="hapLabel"><input type="checkbox" switch id="hapInput"></label>

function norm(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[’'`]/g,'').replace(/[^a-z0-9\u3400-\u9fff\s]/g,' ').replace(/\s+/g,' ').trim();
}
function stripQty(s){

function autoCategory(name){
  const n = norm(stripQty(name)) || norm(name);
  if (!n) return 'other';
  const words = n.split(' ');
  const compact = n.replace(/\s+/g,'');
  for (const m of FROZEN_MARK) if (CJK.test(m) ? compact.includes(m) : words.some(w => w === m || w.startsWith(m))) return 'frozen';
  let best = 'other', score = 0;
  for (const [k, cat] of DICT){
    let s = 0;
    if (CJK.test(k)){
      const i = compact.lastIndexOf(k);
      if (i >= 0) s = k.length * 10 + (i + k.length === compact.length ? 50 : 0);
    } else if (k.includes(' ')){
      if ((' '+n+' ').includes(' '+k+' ')) s = k.length + 80;
    } else {
      for (let i = 0; i < words.length; i++){
        const w = words[i], last = i === words.length - 1 ? 20 : 0;
        let t = 0;
        if (w === k) t = k.length + 60 + last;
        else if (k.length >= 3 && w.endsWith(k)) t = k.length + 50 + last;
        else if (k.length >= 4 && w.startsWith(k)) t = k.length;
        if (t > s) s = t;
      }
    }
    if (s > score){ score = s; best = cat; }
  }
  return best;
}
/*CAT-END*/

/* ---------- state ---------- */
const KEY = 'groceries.v1';
const mem = {};
const store = {
  get(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return mem[KEY] || null; } },
  set(v){ const s = JSON.stringify(v); mem[KEY] = JSON.parse(s); try { localStorage.setItem(KEY, s); } catch(e){} }
};
let S = Object.assign({items:[], order:[], overrides:{}, history:{}}, store.get() || {});
const save = () => store.set(S);
const keyOf = name => norm(stripQty(name)) || norm(name);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const categorize = name => S.overrides[keyOf(name)] || autoCategory(name);

function getOrder(){
  const custom = (S.order || []).filter(c => CATS[c]);
  return [...custom, ...DEFAULT_ORDER.filter(c => !custom.includes(c))];
}

/* ---------- elements ---------- */
const $ = id => document.getElementById(id);
const listEl = $('list'), clearBtn = $('clearBtn');
const input = $('input'), suggEl = $('sugg');
const sheet = $('sheet'), overlay = $('overlay');

function haptic(){ try { $('hapLabel').click(); } catch(e){} try { navigator.vibrate && navigator.vibrate(10); } catch(e){} }

/* ---------- render ---------- */
function render(flashId){
  const groups = {};
  for (const it of S.items) (groups[it.cat] = groups[it.cat] || []).push(it);
  let html = '';
  for (const cat of getOrder()){
    const g = groups[cat]; if (!g) continue;
    g.sort((a,b) => (a.done - b.done) || (a.done ? a.doneAt - b.doneAt : a.t - b.t));
    const open = g.filter(i => !i.done).length;
    html += `<section class="sec"><h2><span>${esc(CATS[cat])}</span><span>${open || '✓'}</span></h2><ul class="card">` +
      g.map(i => `<li class="row${i.done ? ' done' : ''}" data-id="${i.id}"><span class="check"></span><span class="name">${esc(i.name)}</span></li>`).join('') +
      `</ul></section>`;
  }
  listEl.innerHTML = html || `<div class="empty"><b>Your list is empty</b>Tap anywhere to add groceries.<br>Tap an item to tick it off · hold it to change section.</div>`;
  const done = S.items.filter(i => i.done).length;
  clearBtn.hidden = !done;
  clearBtn.textContent = `Clear ${done}`;
  if (flashId){
    const r = listEl.querySelector(`[data-id="${flashId}"]`);
    if (r){ r.classList.add('flash'); if (document.activeElement !== input) r.scrollIntoView({block:'nearest', behavior:'smooth'}); }
  }
}

/* ---------- add ---------- */
function addItem(raw){
  const name = raw.trim().replace(/\s+/g,' ');
  if (!name) return;
  const k = keyOf(name);
  let it = S.items.find(i => norm(i.name) === norm(name));
  if (it){ it.done = false; }
  else { it = {id:uid(), name, cat:categorize(name), done:false, t:Date.now()}; S.items.push(it); }
  const h = S.history[k];
  S.history[k] = {name: h ? h.name : (stripQty(name) || name), n:(h ? h.n : 0) + 1, last:Date.now()};
  save(); render(it.id);
}

$('addForm').addEventListener('submit', e => {
  e.preventDefault();
  if (!input.value.trim()){ input.blur(); return; }   // return on an empty line closes the keyboard
  addItem(input.value);
  input.value = '';
  renderSugg();
  input.focus();
});
input.addEventListener('input', renderSugg);
input.addEventListener('focus', () => { renderSugg(); setTimeout(() => input.scrollIntoView({block:'center', behavior:'smooth'}), 250); });
input.addEventListener('blur', () => setTimeout(() => {
  if (document.activeElement === input) return;
  if (input.value.trim()){ addItem(input.value); input.value = ''; }  // keep what was typed
  suggEl.innerHTML = '';
}, 60));

// Tap anywhere that isn't an item or a button → start adding
document.addEventListener('click', e => {
  if (sheet.classList.contains('open')) return;
  if (e.target.closest('header')){ input.blur(); return; }
  if (e.target.closest('.row, button, input, label, #sheet, #overlay, #toast, .sugg')) return;
  input.focus();
});


/* ---------- suggestions ---------- */
function renderSugg(){
  if (document.activeElement !== input){ suggEl.innerHTML = ''; return; }
  const q = norm(input.value);
  const active = new Set(S.items.filter(i => !i.done).map(i => keyOf(i.name)));
  let list = Object.entries(S.history).filter(([k]) => !active.has(k));
  if (q) list = list.filter(([k]) => k !== q && (k.startsWith(q) || k.split(' ').some(w => w.startsWith(q)) || (CJK.test(q) && k.includes(q))));
  list.sort((a,b) => (b[1].n - a[1].n) || (b[1].last - a[1].last));
  suggEl.innerHTML = list.slice(0, 10).map(([k,h]) => `<button type="button" data-k="${esc(k)}">${esc(h.name)}</button>`).join('');
  suggEl.scrollLeft = 0;
}
let chipPress = null;
suggEl.addEventListener('pointerdown', e => {
  e.preventDefault(); // keep keyboard open
  const b = e.target.closest('button'); if (!b) return;
  chipPress = {b, fired:false, x:e.clientX, timer:setTimeout(() => {
    chipPress.fired = true; haptic();
    const k = b.dataset.k, h = S.history[k];
    delete S.history[k]; save(); renderSugg();
    toast(`Removed “${h ? h.name : k}” from suggestions`, () => { S.history[k] = h; save(); renderSugg(); });
  }, 600)};
});
suggEl.addEventListener('pointermove', e => { if (chipPress && Math.abs(e.clientX - chipPress.x) > 8){ clearTimeout(chipPress.timer); chipPress = null; } });
suggEl.addEventListener('pointercancel', () => { if (chipPress){ clearTimeout(chipPress.timer); chipPress = null; } });
suggEl.addEventListener('pointerup', e => {
  if (!chipPress) return;
  clearTimeout(chipPress.timer);
  const {b, fired} = chipPress; chipPress = null;
  if (fired) return;
  const h = S.history[b.dataset.k];
  if (h){ addItem(h.name); input.value = ''; renderSugg(); }
});

/* ---------- tap to tick, hold for menu ---------- */
let lp = null;
listEl.addEventListener('pointerdown', e => {
  const row = e.target.closest('.row'); if (!row) return;
  row.classList.add('pressed');
  lp = {row, x:e.clientX, y:e.clientY, fired:false, timer:setTimeout(() => {
    lp.fired = true; row.classList.remove('pressed'); haptic(); openItemSheet(row.dataset.id);
  }, 480)};
});
listEl.addEventListener('pointermove', e => {
  if (lp && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 10) cancelLp();
});
listEl.addEventListener('pointercancel', cancelLp);
listEl.addEventListener('pointerleave', cancelLp);
listEl.addEventListener('pointerup', () => {
  if (!lp) return;
  clearTimeout(lp.timer); lp.row.classList.remove('pressed');
  const {row, fired} = lp; lp = null;
  if (!fired) toggle(row.dataset.id);
});
listEl.addEventListener('contextmenu', e => e.preventDefault());
function cancelLp(){ if (lp){ clearTimeout(lp.timer); lp.row.classList.remove('pressed'); lp = null; } }

function toggle(id){
  const it = S.items.find(i => i.id === id); if (!it) return;
  it.done = !it.done; it.doneAt = Date.now();
  save(); render();
}

clearBtn.addEventListener('click', () => {
  const before = S.items.slice();
  const n = S.items.filter(i => i.done).length;
  S.items = S.items.filter(i => !i.done);
  save(); render();
  toast(`${n} item${n === 1 ? '' : 's'} cleared`, () => { S.items = before; save(); render(); });
});

$('orderBtn').addEventListener('click', openOrderSheet);

/* ---------- sheets ---------- */
function openSheet(html){
  sheet.innerHTML = `<div class="grab"></div>` + html;
  overlay.classList.add('open'); sheet.classList.add('open');
  input.blur();
}
function closeSheet(){ overlay.classList.remove('open'); sheet.classList.remove('open'); }
overlay.addEventListener('click', closeSheet);

function openItemSheet(id){
  const it = S.items.find(i => i.id === id); if (!it) return;
  openSheet(`
    <div class="shead"><button class="textbtn l" data-act="close">Cancel</button>
      <div class="stitle">${esc(it.name)}</div><span class="r"></span>
      <div class="sub">Move to section — remembered for next time</div></div>
    <div class="sbody">
      <div class="card">${getOrder().map(c =>
        `<button class="opt" data-cat="${c}"><span>${esc(CATS[c])}</span><span class="tick">${c === it.cat ? '✓' : ''}</span></button>`).join('')}</div>
      <button class="danger" data-act="delete">Delete item</button>
    </div>`);
  sheet.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.act === 'close') return closeSheet();
    if (b.dataset.act === 'delete'){
      const before = S.items.slice();
      S.items = S.items.filter(i => i.id !== id); save(); render(); closeSheet();
      return toast(`Deleted “${it.name}”`, () => { S.items = before; save(); render(); });
    }
    if (b.dataset.cat){
      const k = keyOf(it.name);
      S.overrides[k] = b.dataset.cat;
      for (const x of S.items) if (keyOf(x.name) === k) x.cat = b.dataset.cat;
      save(); render(id); closeSheet();
      toast(`Moved to ${CATS[b.dataset.cat]}`);
    }
  };
}

function openOrderSheet(){
  openSheet(`
    <div class="shead"><button class="textbtn l" data-act="reset">Reset</button>
      <div class="stitle">Section order</div><button class="textbtn r" data-act="close">Done</button>
      <div class="sub">Drag sections into the order you walk the store</div></div>
    <div class="sbody" id="orderBody"><ul class="card" id="orderList" style="list-style:none;margin:0;padding:0">${orderRows()}</ul></div>`);
  sheet.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.act === 'close') return closeSheet();
    if (b.dataset.act === 'reset'){ S.order = []; save(); render(); $('orderList').innerHTML = orderRows(); }
  };
  enableDrag($('orderList'), $('orderBody'));
}
function orderRows(){
  return getOrder().map(c => `<li class="drow" data-cat="${c}"><span>${esc(CATS[c])}</span>
    <div class="handle" aria-label="Drag"><svg width="20" height="14" viewBox="0 0 20 14" fill="currentColor"><rect y="1" width="20" height="2" rx="1"/><rect y="6" width="20" height="2" rx="1"/><rect y="11" width="20" height="2" rx="1"/></svg></div></li>`).join('');
}
function enableDrag(ul, scroller){
  ul.addEventListener('pointerdown', e => {
    const h = e.target.closest('.handle'); if (!h) return;
    e.preventDefault();
    const li = h.closest('li');
    try { h.setPointerCapture(e.pointerId); } catch(_){}
    let startY = e.clientY, lastY = e.clientY, raf = 0;
    li.classList.add('dragging'); haptic();
    const step = () => {
      const r = scroller.getBoundingClientRect();
      let d = 0;
      if (lastY < r.top + 50) d = -8; else if (lastY > r.bottom - 50) d = 8;
      if (d){ const before = scroller.scrollTop; scroller.scrollTop += d; startY -= scroller.scrollTop - before; place(); }
      raf = requestAnimationFrame(step);
    };
    const place = () => {
      let dy = lastY - startY;
      const next = li.nextElementSibling, prev = li.previousElementSibling;
      if (next && dy > next.offsetHeight / 2){ ul.insertBefore(next, li); startY += next.offsetHeight; }
      else if (prev && dy < -prev.offsetHeight / 2){ ul.insertBefore(li, prev); startY -= prev.offsetHeight; }
      li.style.transform = `translateY(${lastY - startY}px)`;
    };
    const move = ev => { lastY = ev.clientY; place(); };
    const up = () => {
      cancelAnimationFrame(raf);
      li.style.transform = ''; li.classList.remove('dragging');
      h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
      S.order = [...ul.children].map(x => x.dataset.cat); save(); render();
    };
    h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
    raf = requestAnimationFrame(step);
  });
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, undo){
  const t = $('toast'), b = $('toastBtn');
  $('toastMsg').textContent = msg;
  b.hidden = !undo;
  b.onclick = () => { undo && undo(); t.classList.remove('show'); };
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), undo ? 5000 : 2200);
}


/* ---------- start ---------- */
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
</script>
